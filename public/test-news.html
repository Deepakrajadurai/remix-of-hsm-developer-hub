<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Service Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .news-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .news-content {
            padding: 20px;
        }
        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
        }
        .news-source {
            font-weight: 600;
            color: #667eea;
        }
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .stat {
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI News Service Test</h1>
        <p class="subtitle">Test the news fetching service without needing the full app</p>
        
        <button id="fetchBtn" onclick="fetchNews()">
            <span id="btnText">Fetch AI News</span>
        </button>
        
        <div id="message"></div>
        <div id="stats" class="stats" style="display: none;">
            <div class="stat">
                <div class="stat-value" id="articleCount">0</div>
                <div class="stat-label">Articles</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="sourceCount">0</div>
                <div class="stat-label">Sources</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="withImages">0</div>
                <div class="stat-label">With Images</div>
            </div>
        </div>
        
        <div id="newsContainer" class="news-grid"></div>
    </div>

    <script type="module">
        // Simulated news fetching (works without backend)
        async function fetchCuratedNews() {
            return [
                {
                    title: "OpenAI Releases GPT-5: Major Breakthrough in Language Understanding",
                    description: "OpenAI announces GPT-5 with unprecedented reasoning capabilities and multimodal understanding, marking a new era in artificial intelligence.",
                    url: "https://openai.com",
                    imageUrl: "https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1000&auto=format&fit=crop",
                    source: "OpenAI",
                    publishedAt: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString()
                },
                {
                    title: "Google DeepMind Achieves Quantum Computing Milestone",
                    description: "DeepMind's quantum AI system solves complex optimization problems 1000x faster than classical computers.",
                    url: "https://deepmind.google",
                    imageUrl: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?q=80&w=2070&auto=format&fit=crop",
                    source: "Google DeepMind",
                    publishedAt: new Date(Date.now() - 5 * 60 * 60 * 1000).toISOString()
                },
                {
                    title: "AI-Powered Drug Discovery Accelerates Cancer Treatment Research",
                    description: "New AI models identify potential cancer treatments in weeks instead of years, revolutionizing pharmaceutical research.",
                    url: "https://www.nature.com",
                    imageUrl: "https://images.unsplash.com/photo-1576086213369-97a306d36557?q=80&w=2080&auto=format&fit=crop",
                    source: "Nature",
                    publishedAt: new Date(Date.now() - 8 * 60 * 60 * 1000).toISOString()
                },
                {
                    title: "Autonomous Vehicles Achieve Level 5 Autonomy in Major Cities",
                    description: "Self-driving cars now operate without human intervention in urban environments, marking a transportation revolution.",
                    url: "https://techcrunch.com",
                    imageUrl: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=2070&auto=format&fit=crop",
                    source: "TechCrunch",
                    publishedAt: new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString()
                },
                {
                    title: "AI Chip Manufacturers Report Record Demand Amid Tech Boom",
                    description: "NVIDIA and AMD see unprecedented demand for AI accelerators as companies race to deploy machine learning systems.",
                    url: "https://www.reuters.com",
                    imageUrl: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?q=80&w=2074&auto=format&fit=crop",
                    source: "Reuters",
                    publishedAt: new Date(Date.now() - 18 * 60 * 60 * 1000).toISOString()
                },
                {
                    title: "Breakthrough in Natural Language Processing Enables Real-Time Translation",
                    description: "New transformer models achieve human-level translation accuracy across 100+ languages in real-time.",
                    url: "https://arxiv.org",
                    imageUrl: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2070&auto=format&fit=crop",
                    source: "arXiv",
                    publishedAt: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()
                }
            ];
        }

        window.fetchNews = async function() {
            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const newsContainer = document.getElementById('newsContainer');
            const statsDiv = document.getElementById('stats');
            
            btn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Fetching...';
            messageDiv.innerHTML = '';
            newsContainer.innerHTML = '';
            
            try {
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const articles = await fetchCuratedNews();
                
                if (articles.length === 0) {
                    messageDiv.innerHTML = '<div class="error">No articles found</div>';
                    return;
                }
                
                // Show stats
                const sources = new Set(articles.map(a => a.source));
                const withImages = articles.filter(a => a.imageUrl).length;
                
                document.getElementById('articleCount').textContent = articles.length;
                document.getElementById('sourceCount').textContent = sources.size;
                document.getElementById('withImages').textContent = withImages;
                statsDiv.style.display = 'flex';
                
                messageDiv.innerHTML = `<div class="success">✅ Successfully fetched ${articles.length} AI & tech news articles!</div>`;
                
                // Display articles
                articles.forEach(article => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    
                    const timeAgo = getTimeAgo(new Date(article.publishedAt));
                    
                    card.innerHTML = `
                        ${article.imageUrl ? `<img src="${article.imageUrl}" alt="${article.title}" class="news-image" onerror="this.style.display='none'">` : ''}
                        <div class="news-content">
                            <div class="news-title">${article.title}</div>
                            <div class="news-description">${article.description}</div>
                            <div class="news-meta">
                                <span class="news-source">${article.source}</span>
                                <span>${timeAgo}</span>
                            </div>
                        </div>
                    `;
                    
                    card.onclick = () => window.open(article.url, '_blank');
                    card.style.cursor = 'pointer';
                    
                    newsContainer.appendChild(card);
                });
                
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Fetch AI News Again';
            }
        };
        
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            const intervals = {
                year: 31536000,
                month: 2592000,
                week: 604800,
                day: 86400,
                hour: 3600,
                minute: 60
            };
            
            for (const [name, seconds_in_interval] of Object.entries(intervals)) {
                const interval = Math.floor(seconds / seconds_in_interval);
                if (interval >= 1) {
                    return interval === 1 ? `1 ${name} ago` : `${interval} ${name}s ago`;
                }
            }
            
            return 'Just now';
        }
    </script>
</body>
</html>
